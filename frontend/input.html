<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Product</title>
  <style>
    body { font-family: Arial; margin: 40px; max-width: 600px; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 6px; margin-top: 5px; }
    button { margin-top: 12px; padding: 8px 12px; }
    #response { margin-top: 20px; color: green; }
  </style>
</head>
<body>
   
  <h2>Add Product to Weaviate</h2>

  <form id="productForm">
    <label>product id:</label>
    <input id="product_id" required>

    <label>product code:</label>
    <input id="product_code" required>

    <label>product name:</label>
    <input id="name" required>

    <label>product description:</label>
    <input id="desc">

    <label>price:</label>
    <input id="price" type="number" required>

    <label>gender:</label>
    <input id="gender" required>

    <label>highlight:</label>
    <input id="highlight">

    <label>technology:</label>
    <input id="technology">

    <label>material:</label>
    <input id="material" required>

    <label>style:</label>
    <input id="style" required>

    <label>usage:</label>
    <input id="usage" required>

    <label>feature:</label>
    <input id="feature" required>

    <label>care:</label>
    <input id="care">

    <label>video:</label>
    <input id="video">

    <label>image:</label>
    <input id="image" required>
    
    <label>available color:</label>
    <input id="available_color" required>

    <label>available size:</label>
    <input id="available_size" required>

    <label>color by size:</label>
    <input id="colorBySize" required>

    <label>product url:</label>
    <input id="product_url" required>

    <button type="submit">Add Product</button>
  </form>

  <p id="response"></p>

  <script>
    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const product = {
        product_id: document.getElementById("product_id").value,
        product_code: document.getElementById("product_code").value,
        name: document.getElementById("name").value,
        desc: document.getElementById("desc").value,
        price: parseInt(document.getElementById("price").value),
        gender: document.getElementById("gender").value,
        highlight: document.getElementById("highlight").value,
        technology: document.getElementById("technology").value,
        material: document.getElementById("material").value,
        style: document.getElementById("style").value,
        usage: document.getElementById("usage").value,
        feature: document.getElementById("feature").value,
        care: document.getElementById("care").value,
        video: document.getElementById("video").value,
        image: document.getElementById("image").value,
        available_color: document.getElementById("available_color").value,
        available_size: document.getElementById("available_size").value,
        colorBySize: document.getElementById("colorBySize").value,
      };

      const res = await fetch("http://127.0.0.1:8000/add_product", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product),
      });

      const result = await res.json();
      document.getElementById("response").innerText =
        result.message || "❌ " + result.error;
      document.getElementById("productForm").reset();
    });
  </script>
</body>
</html>
